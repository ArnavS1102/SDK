# CPU Lambdas + optional results/DLQ — `WORKER_CONFIG=mylo`.
# Create SQS queues in AWS to match names below, then enable cpu_video in Terraform when ready.

aws:
  region: "us-east-1"
  work_bucket: "mylostudio-content"

queues:
  results:   "mylo-dev-results"
  dlq:      "mylo-dev-dlq"
  cpu_image: "mylo-dev-cpu-image"
  cpu_video: "mylo-dev-cpu-video"

steps:
  IMAGE_CPU:
    filetype: "png"
    extensions: [".png", ".jpg", ".jpeg", ".json", ".webp"]
    queue: "cpu_image"

  VIDEO_CPU:
    filetype: "mp4"
    extensions: [".mp4", ".json", ".webp", ".jpg", ".jpeg", ".png"]
    queue: "cpu_video"
