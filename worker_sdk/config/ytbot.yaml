# config.yaml — **ytbot** (CPU Lambdas).
# ``queues`` lists only queues that exist in AWS. Every ``steps.*.queue`` value must be a key here.

aws:
  account_id: "581867121448"
  region: "us-east-1"
  work_bucket: "mylostudio-content"

queues:
  image:     "ytbot-dev-video-image-requested"
  animate:   "ytbot-dev-video-animate-requested"
  cpu_light: "ytbot-dev-cpu-light"

steps:
  IMAGE_CPU:
    filetype: "png"
    extensions: [".png", ".jpg", ".jpeg", ".json", ".webp"]
    queue: "image"

  VIDEO_CPU:
    filetype: "mp4"
    extensions: [".mp4", ".json", ".webm"]
    queue: "animate"

  LIGHT_CPU:
    filetype: "json"
    extensions: [".json", ".png", ".jpg", ".jpeg"]
    queue: "cpu_light"
