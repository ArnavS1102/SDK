# config.yaml
# SEGMENTATION: Grounding DINO (4-category prompt, enclosing filter, NMS) -> crops on white.

aws:
  # account_id is read from AWS_ACCOUNT_ID env var at runtime — not stored here.
  region: "us-east-1"
  work_bucket: "vastra"

queues:
  segmentation:   "vastra-dev-segmentation"
  analysis:       "vastra-dev-analysis"
  identification: "vastra-dev-identification"
  vton:           "vastra-dev-vton"
  avatar:         "vastra-dev-avatar"
  model_profile:  "vastra-dev-model-profile"
  shot:           "vastra-dev-shot-creation"
  results:        "vastra-dev-results"
  dlq:            "vastra-dev-dlq"
  # CPU-only (Lambda consumers). Create these queues in AWS to match names.
  cpu_image:      "vastra-dev-cpu-image"
  cpu_video:      "vastra-dev-cpu-video"
  cpu_light:      "vastra-dev-cpu-light"

steps:
  ENHANCEMENT:
    filetype: "png"
    extensions: [".png"]
    hooks_path: "services.cloth_enhancement.hooks.Hooks"
    next:
      - SEGMENTATION
    queue: "identification"

  SEGMENTATION:
    filetype: "png"
    extensions: [".png"]
    hooks_path: "services.cloth_segmentation.hooks.Hooks"
    next:
      - ANALYSIS
    queue: "segmentation"

  ANALYSIS:
    filetype: "json"
    extensions: [".json"]
    hooks_path: "services.cloth_analysis.hooks.Hooks"
    queue: "analysis"
    # no next: terminal step

  VIRTUAL_TRY:
    filetype: "png"
    extensions: [".png", ".jpg", ".jpeg"]
    hooks_path: "services.virtualtry.hooks.Hooks"
    queue: "vton"

  AVATAR:
    filetype: "png"
    extensions: [".png"]
    hooks_path: "services.avatar.hooks.Hooks"
    queue: "avatar"

  MODEL_PROFILE:
    filetype: "png"
    extensions: [".png"]
    hooks_path: "services.model_profile.hooks.Hooks"
    queue: "model_profile"
    next:
      - AVATAR

  SHOT_CREATION:
    filetype: "png"
    extensions: [".png", ".jpg", ".jpeg"]
    queue: "shot"
    next:
      - AVATAR

  # CPU contract steps — consumed by Lambda (not GPU runner). No hooks_path.
  IMAGE_CPU:
    filetype: "png"
    extensions: [".png", ".jpg", ".jpeg", ".json", ".webp"]
    queue: "cpu_image"

  VIDEO_CPU:
    filetype: "mp4"
    extensions: [".mp4", ".json", ".webm"]
    queue: "cpu_video"

  LIGHT_CPU:
    filetype: "json"
    extensions: [".json", ".png", ".jpg", ".jpeg"]
    queue: "cpu_light"
